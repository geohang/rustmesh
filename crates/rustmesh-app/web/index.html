<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f5f5f7">
<title>rustmesh · Mesh Studio</title>
<style>
  :root { color-scheme: light dark; --surface: #f5f5f7; --ink: #1d1d1f; --muted: #6e6e73; }
  html { touch-action: manipulation; }
  html, body { overflow: hidden; margin: 0; padding: 0; height: 100%; width: 100%; background: var(--surface); }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: var(--ink); }
  @media (prefers-color-scheme: dark) { :root { --surface: #242426; --ink: #f5f5f7; --muted: #a5a5ae; } }
  canvas { display: block; position: absolute; inset: 0; width: 100%; height: 100%; }
  #loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
             flex-direction: column; gap: 14px; padding: 32px; text-align: center; pointer-events: none; }
  .mark { width: 64px; height: 64px; border-radius: 18px; background: #0071e3; display: grid; place-items: center; }
  h1 { font-size: 28px; letter-spacing: -.8px; margin: 4px 0 0; font-weight: 600; }
  #loading p { color: var(--muted); font-size: 14px; margin: 0; }
  .progress { width: 24px; height: 24px; margin-top: 14px; border: 2px solid #0071e330; border-top-color: #0071e3;
              border-radius: 50%; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .progress { animation: none; } }
</style>
</head>
<body>
<canvas id="rustmesh"></canvas>
<div id="loading" role="status" aria-live="polite">
  <div class="mark" aria-hidden="true"><svg width="44" height="44" viewBox="0 0 44 44" fill="none" stroke="white" stroke-width="1.5"><path d="M7 35 22 6 37 35ZM7 35 22 25 37 35M22 6V25"/></svg></div>
  <h1>rustmesh</h1><p>Preparing your workspace…</p><div class="progress" aria-hidden="true"></div>
</div>
<script type="module">
  // The app removes the loading note once it runs; meshing happens in worker.js.
  import init from "./rustmesh_app.js";
  init().catch((e) => {
    document.getElementById("loading").textContent = "The mesh builder could not start: " + e;
  });
</script>
</body>
</html>
