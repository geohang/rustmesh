[package]
name = "rustmesh"
description = "Quality 2D triangle meshing with regions, holes, local sizing and kept segments, and experimental 3D tetrahedral meshing."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
spade = { workspace = true }
robust = "1.2"
serde = { version = "1", features = ["derive"], optional = true }

[features]
# Serialize models (project files).
serde = ["dep:serde"]

[dev-dependencies]
serde_json = "1"
